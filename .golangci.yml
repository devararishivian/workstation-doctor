# Source of truth for project linters. Run with:
#   golangci-lint run ./...       # check
#   golangci-lint run --fix ./... # fix automatically what the tool can fix
#   golangci-lint fmt ./...       # format
version: "2"
run:
  timeout: 5m
linters:
  enable:
    - govet        # built-in static analysis
    - errcheck     # discarded errors without reason
    - staticcheck  # common bug patterns
    - unused       # unused code
    - ineffassign  # ineffective assignments
    - unconvert    # redundant conversions
    - misspell     # typos in comments and code
    - predeclared  # shadowed builtin identifiers (len, cap, ...)
    - revive       # general style rules
    - gocritic     # code improvement opinions
    - modernize    # current Go idioms (go1.21-1.27)
    - wrapcheck    # external errors must carry context
    - errorlint    # correct %w usage and error comparisons
    - rowserrcheck # rows.Err must be checked
    - nilnil       # no simultaneous nil return values
    - nolintlint   # //nolint must name the linter and give a reason
  settings:
    errcheck:
      # Writes to stdout need no action.
      # Best-effort closes use //nolint with a reason per line.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    nolintlint:
      require-specific: true
      require-explanation: true
formatters:
  enable:
    - gofumpt
    - goimports
